name: DEELA 0.9.9 private official-key signed test APK

on:
  push:
    branches: [feature/deela-unified-owner-v099]
    paths:
      - "app/**"
      - "gradle/**"
      - "gradlew"
      - "settings.gradle.kts"
      - ".github/workflows/deela-v099-private-signed-test.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-privately:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Require permanent DEELA signing identity
        env:
          HAS_STORE: ${{ secrets.DEELA_RELEASE_KEYSTORE_BASE64 != '' }}
          HAS_PASSWORD: ${{ secrets.DEELA_RELEASE_KEYSTORE_PASSWORD != '' }}
        run: |
          set -euo pipefail
          test "$HAS_STORE" = "true" || { echo "::error::Permanent DEELA keystore is not configured"; exit 1; }
          test "$HAS_PASSWORD" = "true" || { echo "::error::Permanent DEELA keystore password is not configured"; exit 1; }
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install Android 37 SDK and signing tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile and shrink v0.9.9 without signing secrets
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk
      - name: Decode existing permanent keystore inside temporary runner
        env:
          DEELA_RELEASE_KEYSTORE_BASE64: ${{ secrets.DEELA_RELEASE_KEYSTORE_BASE64 }}
          DEELA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DEELA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import base64, os, pathlib, re, sys
          raw=os.environ["DEELA_RELEASE_KEYSTORE_BASE64"]
          cleaned="".join(ch for ch in raw if not ch.isspace() and ord(ch) not in (0x200b,0x200c,0x200d,0xfeff))
          candidates=[cleaned]+sorted(re.findall(r"[A-Za-z0-9+/]{500,}={0,2}",cleaned),key=len,reverse=True)
          decoded=None
          for candidate in candidates:
              try:
                  value=base64.b64decode(candidate,validate=True)
                  if 1024<=len(value)<=65536 and value[0]==0x30:
                      decoded=value;break
              except (ValueError,base64.binascii.Error):
                  pass
          if decoded is None:
              print("::error::Invalid PKCS12 key value");sys.exit(1)
          pathlib.Path(os.environ["RUNNER_TEMP"],"deela-release.p12").write_bytes(decoded)
          print("Keystore decoded without printing it")
          PY
          openssl pkcs12 -info -noout \
            -in "$RUNNER_TEMP/deela-release.p12" \
            -passin env:DEELA_RELEASE_KEYSTORE_PASSWORD >/dev/null
      - name: Sign and verify original DEELA identity
        env:
          DEELA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DEELA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          APK="dist/DEELA-v0.9.9-Owner-Control-private-signed.apk"
          mkdir -p dist
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/deela-aligned.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --ks "$RUNNER_TEMP/deela-release.p12" --ks-type PKCS12 \
            --ks-key-alias deela_release \
            --ks-pass env:DEELA_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:DEELA_RELEASE_KEYSTORE_PASSWORD \
            --out "$APK" "$RUNNER_TEMP/deela-aligned.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/verify.txt"
          SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/verify.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          PIN="83698bc6e21ddabb83eaf45d3386170d676dcf96270081c163f8b2e107fdef3c"
          if [ "$SIGNER" != "$PIN" ]; then
            echo "::error::Signing identity differs from installed official DEELA"; exit 1
          fi
          PACKAGE="$("$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$PACKAGE" | grep -F "name='com.deela.apps'"
          echo "$PACKAGE" | grep -F "versionName='0.9.9'"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
          echo "Private signed test only; no public release is created."
      - name: Save private signed test APK without public release
        uses: actions/upload-artifact@v4
        with:
          name: DEELA-0.9.9-private-official-key-signed-test
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Delete temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/deela-release.p12"
