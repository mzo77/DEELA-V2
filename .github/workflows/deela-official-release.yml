name: DEELA Official Signed Release

# The owner deliberately publishes a release after setting up a permanent signing key.
# Never ship an unsigned or ephemeral debug-signed APK as an official update.
on:
  push:
    branches: [main]
    paths:
      - '.github/deela-release-request/official-0.9.8.txt'
  workflow_dispatch:
    inputs:
      source_ref:
        description: "Reviewed DEELA source branch or SHA to release"
        required: true
        type: string
        default: feature/admin-source-updates-and-signup-requests
      release_notes:
        description: "Short update notes shown to subscribers"
        required: false
        type: string
        default: "تحديث تطبيقات ديلا: تحسين تسجيل الدخول، الاشتراكات، إدارة المصادر، والاستقرار."

permissions:
  contents: write

concurrency:
  group: deela-official-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 85
    steps:
      - name: Check out the reviewed Android source
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.source_ref || 'feature/admin-source-updates-and-signup-requests' }}
          persist-credentials: true

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: Install Android platform and signing tools
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;36.1.0"
          test -x "$ANDROID_HOME/build-tools/36.1.0/apksigner"

      - name: Build production APK without any signing secrets
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleRelease
          test -s app/build/outputs/apk/release/app-release-unsigned.apk

      - name: Restore permanent signing key only after Gradle has finished
        env:
          DEELA_RELEASE_KEYSTORE_BASE64: ${{ secrets.DEELA_RELEASE_KEYSTORE_BASE64 }}
          DEELA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DEELA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "$DEELA_RELEASE_KEYSTORE_BASE64" ] || [ -z "$DEELA_RELEASE_KEYSTORE_PASSWORD" ]; then
            echo "::error::Set DEELA_RELEASE_KEYSTORE_BASE64 and DEELA_RELEASE_KEYSTORE_PASSWORD in Settings → Secrets and variables → Actions. Official release is blocked without a permanent signing key."
            exit 1
          fi
          umask 077
          # The mobile clipboard can add whitespace or zero-width characters.
          # Decode inside the runner without printing certificate bytes to logs.
          python3 - <<'PY'
          import base64, os, pathlib, re, sys
          raw = os.environ["DEELA_RELEASE_KEYSTORE_BASE64"]
          cleaned = "".join(c for c in raw if not c.isspace() and ord(c) not in (0x200b, 0x200c, 0x200d, 0xfeff))
          candidates = [cleaned]
          candidates.extend(sorted(re.findall(r"[A-Za-z0-9+/]{500,}={0,2}", cleaned), key=len, reverse=True))
          recovered = None
          for candidate in candidates:
              try:
                  value = base64.b64decode(candidate, validate=True)
                  if 1024 <= len(value) <= 65536 and value[0] == 0x30:
                      recovered = value
                      break
              except (ValueError, base64.binascii.Error):
                  pass
          if recovered is None:
              print("::error::Invalid PKCS12 Base64 secret. Replace DEELA_RELEASE_KEYSTORE_BASE64 with the complete original value from DEELA_SECRET_1_COPY_VALUE.txt.")
              sys.exit(1)
          pathlib.Path(os.environ["RUNNER_TEMP"],"deela-release.p12").write_bytes(recovered)
          print("PKCS12 Base64 decoded locally in the runner.")
          PY
          openssl pkcs12 -info -noout -in "$RUNNER_TEMP/deela-release.p12" -passin env:DEELA_RELEASE_KEYSTORE_PASSWORD >/dev/null

      - name: Align and sign without exposing secrets to project build scripts
        env:
          DEELA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DEELA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*val appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected Android version"; exit 1; }
          mkdir -p dist
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -f 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            "$RUNNER_TEMP/deela-release-aligned.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign \
            --ks "$RUNNER_TEMP/deela-release.p12" \
            --ks-type PKCS12 \
            --ks-key-alias deela_release \
            --ks-pass env:DEELA_RELEASE_KEYSTORE_PASSWORD \
            --key-pass env:DEELA_RELEASE_KEYSTORE_PASSWORD \
            --out "dist/DEELA-$VERSION-release.apk" \
            "$RUNNER_TEMP/deela-release-aligned.apk"
          test -s "dist/DEELA-$VERSION-release.apk"

      - name: Verify signature identity, version, and APK digest
        id: verify
        run: |
          set -euo pipefail
          VERSION="$(sed -n 's/.*val appVersionName = "\([^"]*\)".*/\1/p' app/build.gradle.kts | head -n 1)"
          [[ "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Unexpected Android version"; exit 1; }
          TAG="v$VERSION"
          if GH_TOKEN="${{ github.token }}" gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "::error::Official release $TAG already exists. Bump the version before publishing."
            exit 1
          fi
          SIGNER_REPORT="$RUNNER_TEMP/deela-signature.txt"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "dist/DEELA-$VERSION-release.apk" > "$SIGNER_REPORT"
          SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$SIGNER_REPORT" | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          PIN="83698bc6e21ddabb83eaf45d3386170d676dcf96270081c163f8b2e107fdef3c"
          if [ "$SIGNER" != "$PIN" ]; then
            echo "::error::APK signing certificate does not match DEELA's permanent official signing identity."
            exit 1
          fi
          PKG="$("$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "dist/DEELA-$VERSION-release.apk" | head -n 1)"
          echo "$PKG" | grep -Fq "name='com.deela.apps'"
          echo "$PKG" | grep -Fq "versionName='$VERSION'"
          mkdir -p dist
          APK="DEELA-$VERSION-release.apk"
          (cd dist && sha256sum "$APK" > "$APK.sha256")
          test -s "dist/$APK.sha256"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "apk=$APK" >> "$GITHUB_OUTPUT"
          echo "Signer fingerprint (public): $SIGNER"

      - name: Save signed APK and checksum for owner
        uses: actions/upload-artifact@v4
        with:
          name: DEELA-${{ steps.verify.outputs.version }}-official-signed-APK
          path: dist/
          retention-days: 90
          if-no-files-found: error

      - name: Publish public, stable GitHub Release for in-app update notifications
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_NOTES: "${{ inputs.release_notes || 'تحديث تطبيقات ديلا 0.9.8: إصدار رسمي بنظام التحديثات للمشتركين.' }}"
          TAG: ${{ steps.verify.outputs.tag }}
          APK: ${{ steps.verify.outputs.apk }}
        run: |
          set -euo pipefail
          echo "تطبيقات ديلا ❤️" > "$RUNNER_TEMP/release-notes.txt"
          printf '\n%s\n\n' "$RELEASE_NOTES" >> "$RUNNER_TEMP/release-notes.txt"
          cat >> "$RUNNER_TEMP/release-notes.txt" <<'NOTES'
          هذا إصدار رسمي موقّع من تطبيقات ديلا. تُفحص بصمة SHA-256 قبل التثبيت.

          تنبيه: أول انتقال من نسخة Debug التجريبية إلى هذا الإصدار قد يتطلب إزالة النسخة القديمة ثم تسجيل الدخول من جديد بسبب اختلاف شهادة التوقيع.
          بعد تثبيت النسخة الرسمية، ستعمل تحديثات الإصدارات الرسمية التالية فوقها مع الاحتفاظ ببيانات التطبيق.
          NOTES
          gh release create "$TAG" "dist/$APK" "dist/$APK.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --target "$(git rev-parse HEAD)" \
            --title "تطبيقات ديلا $TAG — إصدار رسمي" \
            --notes-file "$RUNNER_TEMP/release-notes.txt" \
            --latest

      - name: Confirm public release and APK metadata are visible to subscribers
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ steps.verify.outputs.tag }}
          APK: ${{ steps.verify.outputs.apk }}
        run: |
          set -euo pipefail
          gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name' | grep -Fx "$TAG"
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" --json assets --jq '.assets[].name' | grep -Fx "$APK"
          echo "Official release is live. DEELA's startup update checker will offer this signed APK to compatible installations."

      - name: Remove signing key from temporary runner
        if: always()
        run: rm -f "$RUNNER_TEMP/deela-release.p12"
