name: DEELA Auth Branch Compile Check
on:
  push:
    branches:
      - fix/persistent-login-autofill
    paths:
      - 'app/**'
      - 'control-center/supabase/deela-control/index.ts'
      - '.github/workflows/deela-auth-branch-check.yml'
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android platform
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile Android APK and run unit tests
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug :app:testDebugUnitTest
