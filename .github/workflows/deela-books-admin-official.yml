name: DEELA Books Admin Official APK
on:
  push:
    branches: [feature/deela-books-private-marketplace]
    paths:
      - "deela-books-admin/**"
      - "deela-books/site/**"
      - "app/src/main/assets/books/**"
      - "settings.gradle.kts"
      - "gradle/**"
      - "gradlew"
      - "scripts/sync-deela-books-assets.mjs"
      - ".github/workflows/deela-books-admin-official.yml"
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: deela-books-admin-official
  cancel-in-progress: true
jobs:
  build-and-sign:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Verify dedicated app and private portal consistency
        run: |
          set -euo pipefail
          node --check deela-books/site/app.js
          node --check app/src/main/assets/books/app.js
          cmp deela-books/site/app.js app/src/main/assets/books/app.js
          cmp deela-books/site/index.html app/src/main/assets/books/index.html
          cmp deela-books/site/style.css app/src/main/assets/books/style.css
          python3 - <<'PY'
          from pathlib import Path
          manifest=Path('deela-books-admin/src/main/AndroidManifest.xml').read_text()
          gradle=Path('deela-books-admin/build.gradle.kts').read_text()
          activity=Path('deela-books-admin/src/main/java/com/deela/books/admin/AdminActivity.kt').read_text()
          assert 'applicationId = "com.deela.books.admin"' in gradle
          assert 'versionName = "1.0.2"' in gradle
          assert 'android:label="DEELA ADMIN"' in manifest
          assert 'OWNER_PORTAL' in activity and 'books-private/' in activity
          assert 'type = "image/*"' in activity
          print('Standalone Arabic owner app and gallery picker verified')
          PY
      - name: Require permanent official signing credentials
        env:
          KEY_PRESENT: ${{ secrets.DEELA_RELEASE_KEYSTORE_BASE64 != '' }}
          PASSWORD_PRESENT: ${{ secrets.DEELA_RELEASE_KEYSTORE_PASSWORD != '' }}
        run: |
          test "$KEY_PRESENT" = true || { echo "::error::Official permanent signing key missing"; exit 1; }
          test "$PASSWORD_PRESENT" = true || { echo "::error::Official permanent signing password missing"; exit 1; }
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release package without signing material
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :deela-books-admin:assembleRelease
          test -s deela-books-admin/build/outputs/apk/release/deela-books-admin-release-unsigned.apk
      - name: Decode official keystore in runner temp directory
        env:
          DEELA_RELEASE_KEYSTORE_BASE64: ${{ secrets.DEELA_RELEASE_KEYSTORE_BASE64 }}
          DEELA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DEELA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          python3 - <<'PY'
          import os,base64,pathlib,re,sys
          raw=os.environ['DEELA_RELEASE_KEYSTORE_BASE64']
          cleaned=''.join(ch for ch in raw if not ch.isspace() and ord(ch) not in (0x200b,0x200c,0x200d,0xfeff))
          candidates=[cleaned]+sorted(re.findall(r'[A-Za-z0-9+/]{500,}={0,2}',cleaned),key=len,reverse=True)
          decoded=None
          for token in candidates:
            try:
              data=base64.b64decode(token,validate=True)
              if 1024<=len(data)<=65536 and data[0]==0x30:
                decoded=data;break
            except (ValueError,base64.binascii.Error):pass
          if decoded is None:
            print('::error::Official signing key could not be decoded');sys.exit(1)
          pathlib.Path(os.environ['RUNNER_TEMP'],'deela-release.p12').write_bytes(decoded)
          PY
          openssl pkcs12 -info -noout -in "$RUNNER_TEMP/deela-release.p12" -passin env:DEELA_RELEASE_KEYSTORE_PASSWORD >/dev/null
      - name: Sign and verify official DEELA Books Admin APK
        env:
          DEELA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DEELA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          mkdir -p dist
          APK=dist/DEELA-Books-Admin-v1.0.2-Official.apk
          INPUT=deela-books-admin/build/outputs/apk/release/deela-books-admin-release-unsigned.apk
          "$ANDROID_HOME/build-tools/36.1.0/zipalign" -f 4 "$INPUT" "$RUNNER_TEMP/DEELA-Books-Admin-aligned.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" sign --ks "$RUNNER_TEMP/deela-release.p12" --ks-type PKCS12 --ks-key-alias deela_release --ks-pass env:DEELA_RELEASE_KEYSTORE_PASSWORD --key-pass env:DEELA_RELEASE_KEYSTORE_PASSWORD --out "$APK" "$RUNNER_TEMP/DEELA-Books-Admin-aligned.apk"
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --verbose --print-certs "$APK" > "$RUNNER_TEMP/deela-admin-cert.txt"
          SIGNER="$(sed -n 's/^Signer #1 certificate SHA-256 digest: //p' "$RUNNER_TEMP/deela-admin-cert.txt" | tr -d ':' | tr '[:upper:]' '[:lower:]' | head -n 1)"
          EXPECTED=83698bc6e21ddabb83eaf45d3386170d676dcf96270081c163f8b2e107fdef3c
          test "$SIGNER" = "$EXPECTED" || { echo "::error::APK is not signed by official DEELA certificate"; exit 1; }
          BADGING="$("$ANDROID_HOME/build-tools/36.1.0/aapt" dump badging "$APK" | head -n 1)"
          echo "$BADGING" | grep -F "name='com.deela.books.admin'"
          echo "$BADGING" | grep -F "versionName='1.0.2'"
          (cd dist && sha256sum *.apk > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: DEELA-Books-Admin-v1.0.2-Official
          path: dist/
          retention-days: 30
          if-no-files-found: error
      - name: Erase temporary signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/deela-release.p12"
