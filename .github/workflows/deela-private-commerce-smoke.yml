name: DEELA Private Commerce Site Security Checks
on:
  push:
    branches: [release/deela-0914-private-commerce]
    paths:
      - "control-center/supabase/deela-shop/**"
      - "control-center/supabase/deela-private-store/**"
      - ".github/workflows/deela-private-commerce-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-privately-hosted-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Check working web landing page, redirect, and owner-only assets
        run: |
          set -euo pipefail
          BASE="https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1"
          PORTAL="https://mzo77.github.io/DEELA-V2/private-store/"
          curl --retry 4 --retry-delay 2 --max-time 25 -sS -D /tmp/web-redirect-headers \
            -o /tmp/web-redirect-body "$BASE/deela-private-store/"
          echo "== Origin redirect headers =="; head -n 22 /tmp/web-redirect-headers
          grep -qiE '^HTTP/[0-9.]+ 302' /tmp/web-redirect-headers
          grep -Fqi "location: $PORTAL" /tmp/web-redirect-headers
          curl --retry 4 --retry-delay 2 --max-time 25 --fail-with-body -sS \
            -D /tmp/portal-headers "$PORTAL" -o /tmp/portal.html
          echo "== Github Pages headers =="; head -n 22 /tmp/portal-headers
          grep -qi '^content-type: text/html' /tmp/portal-headers
          grep -Fq 'بوابة المالك الخاصة' /tmp/portal.html
          grep -Fq 'const PRIVATE=ROOT+"deela-private-store"' /tmp/portal.html
          grep -Fq '"/protected/"' /tmp/portal.html
          ! grep -Fq 'class="product-grid"' /tmp/portal.html
          echo "The owner browser portal is real HTML; no storefront data in public page."
          curl --retry 4 --max-time 25 --fail-with-body -sS \
            "$BASE/deela-private-store/health" -o /tmp/status.json
          python3 - <<'PY'
          import json
          d=json.load(open('/tmp/status.json'))
          assert d.get('ok') is True and d.get('owner_only') is True
          assert d.get('published_publicly') is False
          print("Private shop API health verified.")
          PY
          for p in protected/index.html protected/app.js protected/style.css \
                   protected/admin/index.html protected/admin/admin.js; do
            code="$(curl -sS -o /tmp/result -w '%{http_code}' "$BASE/deela-private-store/$p")"
            test "$code" = "403" || { echo "::error::Owner-only asset $p is exposed HTTP $code"; exit 1; }
          done
          code="$(curl -sS -o /tmp/result -w '%{http_code}' \
              -H 'Authorization: Bearer intentionally-invalid-token' \
              "$BASE/deela-private-store/protected/index.html")"
          test "$code" = "403"
          code="$(curl -sS -o /tmp/result -w '%{http_code}' "$BASE/deela-shop/catalog")"
          test "$code" = "403"
          code="$(curl -sS -o /tmp/result -w '%{http_code}' "$BASE/deela-shop-preview/")"
          test "$code" = "403"
          curl -sS -D /tmp/preflight -o /dev/null -X OPTIONS \
            -H 'Origin: https://mzo77.github.io' \
            -H 'Access-Control-Request-Method: GET' \
            -H 'Access-Control-Request-Headers: authorization' \
            "$BASE/deela-private-store/protected/index.html"
          grep -qi '^HTTP/[0-9.]* 204' /tmp/preflight
          grep -qi '^access-control-allow-origin: https://mzo77.github.io' /tmp/preflight
          grep -qi 'authorization' /tmp/preflight
          echo "Browser CORS and owner authentication barriers are correct."
      - name: Verify no public storefront is shipped in GitHub Pages
        run: |
          set -euo pipefail
          test ! -e docs/store-preview/index.html
          test ! -e docs/store-preview/shop.html
          test ! -e docs/store/index.html
          echo "No DEELA commerce storefront staged for public Pages"
