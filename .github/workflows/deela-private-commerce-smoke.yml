name: DEELA Private Commerce Site Security Checks
on:
  push:
    branches: [release/deela-0914-private-commerce]
    paths:
      - "control-center/supabase/deela-shop/**"
      - "control-center/supabase/deela-private-store/**"
      - ".github/workflows/deela-private-commerce-smoke.yml"
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check-privately-hosted-commerce:
    runs-on: ubuntu-latest
    timeout-minutes: 14
    steps:
      - uses: actions/checkout@v4
      - name: Verify owner-only API and hosted private login
        run: |
          set -euo pipefail
          BASE="https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1"
          curl --retry 4 --max-time 25 --fail-with-body -sS \
            "$BASE/deela-private-store/health" -o /tmp/status.json
          python3 - <<'PY'
          import json
          status=json.load(open("/tmp/status.json"))
          assert status["ok"] is True and status["owner_only"] is True
          assert status["published_publicly"] is False
          print("Private official DEELA web backend available")
          PY
          curl --retry 4 --max-time 25 --fail-with-body -sS \
            "$BASE/deela-private-store/" -o /tmp/owner-login.html
          grep -Fq 'هذه النسخة الحقيقية' /tmp/owner-login.html
          ! grep -Fq 'product-grid' /tmp/owner-login.html
          for p in style.css app.js admin/index.html admin/admin.js api/shop/catalog api/shop/admin/orders; do
            code="$(curl -sS -o /tmp/result -w '%{http_code}' "$BASE/deela-private-store/$p")"
            test "$code" = "403" || { echo "::error::Private endpoint $p exposed HTTP $code"; exit 1; }
          done
          for p in catalog product?slug=deela-ios-monthly admin/overview; do
            code="$(curl -sS -o /tmp/result -w '%{http_code}' "$BASE/deela-shop/$p")"
            test "$code" = "403" || { echo "::error::Public shop endpoint $p exposed HTTP $code"; exit 1; }
          done
          code="$(curl -sS -o /tmp/result -w '%{http_code}' "$BASE/deela-shop-preview/")"
          test "$code" = "403"
          echo "Private site, assets, catalog, and merchant actions deny anonymous visitors"
      - name: Verify no public storefront is shipped in GitHub Pages
        run: |
          set -euo pipefail
          test ! -e docs/store-preview/index.html
          test ! -e docs/store-preview/shop.html
          test ! -e docs/store/index.html
          echo "No DEELA commerce storefront staged for public Pages"
