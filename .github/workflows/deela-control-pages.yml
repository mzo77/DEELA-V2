name: Publish DEELA Web Pages (Owner + iOS)
on:
  push:
    branches: [main]
    paths:
      - 'docs/control/**'
      - 'docs/ios/**'
      - 'docs/mzo/**'
      - 'docs/store-preview/**'
      - 'docs/recover/**'
      - 'docs/recover.html'
      - 'docs/download/**'
      - '.github/workflows/deela-control-pages.yml'
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: deela-control-pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs
      - name: Wait for GitHub artifact registration
        run: sleep 20
      - id: deployment
        uses: actions/deploy-pages@v4
      - name: Verify working recovery URLs on GitHub Pages
        run: |
          set -euo pipefail
          for path in recover.html recover/; do
            curl --fail-with-body --location --retry 8 --retry-all-errors --retry-delay 4 --max-time 25 \
              -H 'Cache-Control: no-cache' \
              "https://mzo77.github.io/DEELA-V2/$path" -o "/tmp/recover-$(echo "$path" | tr '/' '_').html"
            grep -q 'تعيين كلمة مرور جديدة' "/tmp/recover-$(echo "$path" | tr '/' '_').html"
          done
          # The preview publishes only the separate static site, never an APK.
          curl --fail-with-body --location --retry 6 --retry-all-errors --retry-delay 4 --max-time 25 \
            -H 'Cache-Control: no-cache' \
            "https://mzo77.github.io/DEELA-V2/store-preview/" -o /tmp/deela-shop-preview.html
          grep -q 'معاينة متجر DEELA' /tmp/deela-shop-preview.html
          curl --fail-with-body --location --retry 6 --retry-all-errors --retry-delay 4 --max-time 25 \
            "https://mzo77.github.io/DEELA-V2/store-preview/shop.html" -o /tmp/deela-shop-site.html
          grep -q 'deela-shop/admin/overview' /tmp/deela-shop-site.html
