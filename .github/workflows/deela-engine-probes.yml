name: DEELA Three-Engine Runtime Readiness
# These are ephemeral self-tests on GitHub-managed runners, not persistent engines.
# No third-party account, public target, brute-force attempt or external port is used.
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deela-engine-probes.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  swarm:
    name: Pentest Swarm — installed CLI and offline demo
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install official CLI in isolated disposable runner
        run: npm install --global @armurai/pentestswarm
      - name: Verify real command entrypoint and offline bundled demonstration
        shell: bash
        run: |
          set -euo pipefail
          pentestswarm --help > /tmp/deela-swarm-help.txt
          test -s /tmp/deela-swarm-help.txt
          timeout 120s pentestswarm demo > /tmp/deela-swarm-demo.log 2>&1 || {
            echo "Swarm offline demo did not complete; last diagnostic lines:"
            tail -n 35 /tmp/deela-swarm-demo.log
            exit 1
          }
          echo "Pentest Swarm CLI and offline demo executed in this temporary runner."
          echo "No live external systems were scanned. This process is not a DEELA runtime server."

  hexstrike:
    name: HexStrike — Python server bound to loopback
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: 0x4m4/hexstrike-ai
          ref: d689933ff579d839c676c82b231f8e98326c5f04
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install upstream runtime requirements in disposable runner
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile hexstrike_server.py hexstrike_mcp.py
          python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Start loopback-only API and verify /health route
        shell: bash
        run: |
          set -euo pipefail
          export HEXSTRIKE_HOST=127.0.0.1
          export HEXSTRIKE_PORT=8888
          python hexstrike_server.py > "$RUNNER_TEMP/hexstrike.log" 2>&1 &
          pid=$!
          trap 'kill "$pid" 2>/dev/null || true' EXIT
          ok=0
          for n in $(seq 1 20); do
            if curl --silent --show-error --fail --max-time 2 http://127.0.0.1:8888/health > "$RUNNER_TEMP/hexstrike-health.json"; then
              ok=1
              break
            fi
            if ! kill -0 "$pid" 2>/dev/null; then
              echo "HexStrike service exited"; break
            fi
            sleep 2
          done
          if [ "$ok" != 1 ]; then
            tail -n 40 "$RUNNER_TEMP/hexstrike.log"
            echo "HexStrike local HTTP startup FAILED."
            exit 1
          fi
          cat "$RUNNER_TEMP/hexstrike-health.json"
          echo "HexStrike HTTP health verified on localhost only. Not exposed publicly or deployed."

  pentestgpt:
    name: PentestGPT — installed CLI provider registry
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          repository: GreyDGL/PentestGPT
          ref: e8b1bb77d1ac00329675cec3b060aba971ec1ac8
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - name: Install locked Python project requirements
        shell: bash
        run: |
          set -euo pipefail
          uv sync --frozen --no-dev
      - name: Validate CLI launches without calling any model or target
        shell: bash
        run: |
          set -euo pipefail
          uv run --no-sync pentestgpt-legacy --list-models > "$RUNNER_TEMP/pentestgpt-models.txt"
          test -s "$RUNNER_TEMP/pentestgpt-models.txt"
          head -n 30 "$RUNNER_TEMP/pentestgpt-models.txt"
          echo "PentestGPT CLI installed and listed available model definitions."
          echo "No LLM is configured. No external target was scanned. This is not a hosted runtime."
