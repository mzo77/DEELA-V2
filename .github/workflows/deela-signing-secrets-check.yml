name: DEELA Signing Secrets Check
on:
  push:
    branches: [main]
    paths:
      - '.github/deela-release-request/signing-check.txt'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-signing:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Validate signing secrets without exposing private key
        env:
          DEELA_RELEASE_KEYSTORE_BASE64: ${{ secrets.DEELA_RELEASE_KEYSTORE_BASE64 }}
          DEELA_RELEASE_KEYSTORE_PASSWORD: ${{ secrets.DEELA_RELEASE_KEYSTORE_PASSWORD }}
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64, hashlib, os, re, subprocess, sys, tempfile
          raw = os.environ.get("DEELA_RELEASE_KEYSTORE_BASE64", "")
          password = os.environ.get("DEELA_RELEASE_KEYSTORE_PASSWORD", "")
          if not raw:
              print("::error::DEELA_RELEASE_KEYSTORE_BASE64 missing")
              sys.exit(1)
          if not password:
              print("::error::DEELA_RELEASE_KEYSTORE_PASSWORD missing")
              sys.exit(1)
          cleaned = "".join(c for c in raw if not c.isspace() and ord(c) not in (0x200b, 0x200c, 0x200d, 0xfeff))
          candidates = [cleaned]
          candidates.extend(sorted(re.findall(r"[A-Za-z0-9+/]{500,}={0,2}", cleaned), key=len, reverse=True))
          decoded = None
          for candidate in candidates:
              try:
                  test = base64.b64decode(candidate, validate=True)
                  if 1024 <= len(test) <= 65536 and test[0] == 0x30:
                      decoded = test
                      break
              except (ValueError, base64.binascii.Error):
                  pass
          if decoded is None:
              print("::error::GitHub Base64 value is invalid or incomplete. Update DEELA_RELEASE_KEYSTORE_BASE64.")
              sys.exit(1)
          expected_sha256 = "7b6394ba38accc66ba9d62ffb95f009587ce24a9fbc1a70f47ad66b5b13c4d48"
          if hashlib.sha256(decoded).hexdigest() != expected_sha256:
              print("::error::The GitHub keystore does not match the original DEELA keystore. Update DEELA_RELEASE_KEYSTORE_BASE64 from the correct file.")
              sys.exit(1)
          with tempfile.TemporaryDirectory() as directory:
              cert_path = os.path.join(directory,"deela.p12")
              with open(cert_path,"wb") as f:
                  f.write(decoded)
              env = os.environ.copy()
              result = subprocess.run(
                  ["openssl","pkcs12","-in",cert_path,"-info","-noout","-passin","env:DEELA_RELEASE_KEYSTORE_PASSWORD"],
                  env=env, stdout=subprocess.DEVNULL, stderr=subprocess.DEVNULL, check=False)
          if result.returncode:
              print("::error::Original DEELA keystore matches, but the password does not decrypt it. Update DEELA_RELEASE_KEYSTORE_PASSWORD from the correct file.")
              sys.exit(1)
          print("DEELA signing keystore and password match the original, validated without disclosing secrets.")
          PY
