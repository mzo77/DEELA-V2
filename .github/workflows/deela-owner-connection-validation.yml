name: Owner read-only connection validation
on:
  push:
    branches: [deela/owner-readonly-status]
  pull_request:
    branches: [main]
    paths:
      - 'app/src/main/java/dev/aurastore/store/auth/DeelaOwnerScreen.kt'
      - 'control-center/supabase/deela-control/index.ts'
      - '.github/workflows/deela-owner-connection-validation.yml'
permissions:
  contents: read
jobs:
  source-checks:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Check read-only route and client retry behavior
        run: |
          python3 - <<'PY'
          from pathlib import Path
          api=Path('control-center/supabase/deela-control/index.ts').read_text()
          ui=Path('app/src/main/java/dev/aurastore/store/auth/DeelaOwnerScreen.kt').read_text()
          gate='if(path.startsWith("/api/owner/")){const u=await who(req);if(!u||u.role!=="owner")'
          route='if(req.method==="GET"&&path==="/api/owner/connection-status")'
          assert api.count(route)==1
          # The connection route is protected by the owner gate, but other
          # owner endpoints legitimately precede it; 300 chars was a stale test.
          assert 0 < api.index(route)-api.index(gate) < 8192
          line=api[api.index(route):].splitlines()[0]
          assert 'JSON.stringify({ok:true})' in line
          assert '"Cache-Control":"no-store"' in line
          assert 'base+"/api/owner/connection-status"' in ui
          assert 'delay(30_000)' in ui
          assert 'followRedirects(false)' in ui
          assert 'catch(e:CancellationException) { throw e }' in ui
          print('Read-only connection source checks passed')
          PY
  android-compile:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install required Android SDK
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;36.1.0"
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile owner UI without signing or publishing
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon :app:compileDebugKotlin
