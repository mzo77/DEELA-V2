name: DEELA V2 APK Preview

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/deela-apk-preview.yml'
      - 'app/**'
      - 'core/**'
      - 'store/**'
      - 'feature/**'
      - 'build-logic/**'
      - 'gradle/**'
      - 'settings.gradle.kts'
      - 'build.gradle.kts'
      - 'gradlew'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deela-v2-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-preview:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout DEELA V2
        uses: actions/checkout@v4

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install exact Android SDK required by source
        run: |
          sdkmanager --install "platforms;android-37" "build-tools;36.1.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build existing DEELA V2 app (debug-signed preview)
        run: |
          chmod +x ./gradlew
          ./gradlew --no-daemon :app:assembleDebug

      - name: Verify and name APK
        run: |
          set -euo pipefail
          mkdir -p dist
          apk="$(find app/build/outputs/apk/debug -maxdepth 1 -name '*.apk' -type f | head -n 1)"
          test -n "$apk" && test -s "$apk"
          cp "$apk" dist/DEELA-V2-preview.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs dist/DEELA-V2-preview.apk
          sha256sum dist/DEELA-V2-preview.apk > dist/SHA256SUMS.txt

      - name: Save APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEELA-V2-preview-apk
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish a test-only GitHub prerelease
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.8.0-beta.$GITHUB_RUN_NUMBER"
          cat > dist/RELEASE_NOTES.txt <<'NOTES'
          # DEELA APPS V2 | تطبيقات ديلا
          
          **إصدار تجريبي من تطبيق MultiStore بهوية ديلا**
          
          - البحث في مصادر متعددة للتطبيقات
          - عرض معلومات التطبيقات وتنزيلها وتحديثها
          - إدارة التنزيلات والتطبيقات المثبتة
          - دعم الوضع الفاتح والداكن
          - خيارات التثبيت العادي وRoot وShizuku عند توفرها
          
          **تنبيه:** هذه نسخة تجريبية موقعة بمفتاح اختبار، وليست إصدارًا نهائيًا. قد لا تقبل تثبيت تحديث فوق نسخة موقعة بمفتاح مختلف.
          
          مبني على مشروع MultiStore لـFedeFluork وفق GPL-3.0.
          NOTES
          echo "" >> dist/RELEASE_NOTES.txt
          echo "Commit: $GITHUB_SHA" >> dist/RELEASE_NOTES.txt
          gh release create "$tag" dist/DEELA-V2-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DEELA V2 | تطبيقات ديلا - Beta 0.8.0 #$GITHUB_RUN_NUMBER" \
            --notes-file dist/RELEASE_NOTES.txt \
            --prerelease \
            --latest=false
