name: DEELA Aura APK Preview

on:
  push:
    branches: [main]
    paths:
      - 'app/**'
      - 'gradle/**'
      - 'gradlew'
      - 'build.gradle.kts'
      - 'settings.gradle.kts'
      - '.github/workflows/deela-apk-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: deela-aura-preview-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Checkout DEELA Aura
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android platform required by Aura
        run: |
          set -euo pipefail
          SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" -name sdkmanager -type f | head -n 1)"
          test -x "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true
          "$SDKMANAGER" --channel=3 --install "platforms;android-37.0" "build-tools;36.1.0"
          test -s "$ANDROID_HOME/platforms/android-37.0/android.jar"

      - uses: gradle/actions/setup-gradle@v4

      - name: Build DEELA Aura debug APK
        run: |
          set -euo pipefail
          chmod +x gradlew
          ./gradlew --no-daemon :app:assembleDebug
          test -s app/build/outputs/apk/debug/app-debug.apk

      - name: Prepare verified preview
        run: |
          set -euo pipefail
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/DEELA-Aura-preview.apk
          "$ANDROID_HOME/build-tools/36.1.0/apksigner" verify --print-certs dist/DEELA-Aura-preview.apk
          (cd dist && sha256sum DEELA-Aura-preview.apk > SHA256SUMS.txt)

      - name: Save APK as GitHub Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: DEELA-Aura-preview-APK
          path: dist/
          retention-days: 30
          if-no-files-found: error

      - name: Publish DEELA prerelease APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          tag="v0.9.0-aura.${GITHUB_RUN_NUMBER}"
          gh release create "$tag" dist/DEELA-Aura-preview.apk dist/SHA256SUMS.txt \
            --repo "$GITHUB_REPOSITORY" \
            --target "$GITHUB_SHA" \
            --title "DEELA APPS | Aura Preview #${GITHUB_RUN_NUMBER}" \
            --notes "Experimental DEELA APPS Android build from Aura Store (MIT licensed). Subscription gate and control panel integration are not implemented yet. This is a debug-signed APK." \
            --prerelease --latest=false
