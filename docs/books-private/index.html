<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer"><meta name="theme-color" content="#101b2d">
<title>DEELA Books | الدخول الخاص بالمالك</title>
<style>
*{box-sizing:border-box}html{background:#0b1628;color:#f4f9ff;color-scheme:dark}
body{min-height:100dvh;margin:0;padding:19px;display:grid;place-items:center;background:
radial-gradient(ellipse at 78% 10%,#344d70,#111f34 61%,#0b1525);font:500 14px/1.9 Tahoma,Arial,sans-serif}
.login{width:min(455px,100%);background:linear-gradient(145deg,#1c3248,#15243a);
 border:1px solid #57798f;border-radius:24px;padding:31px;box-shadow:0 25px 80px #020915bd}
.mark{width:70px;height:70px;background:linear-gradient(130deg,#a5e8d9,#94b9e8,#bca4e5);
display:grid;place-items:center;border-radius:19px;font:900 47px Arial;color:#11243a}
.eyebrow{display:block;margin:17px 0 8px;color:#9ce4db;font:800 10px Arial;letter-spacing:2px}
h1{font-size:27px;margin:0 0 9px}p{font-size:12px;line-height:2.1;color:#b8cbd9;margin:0 0 20px}
label{display:grid;gap:6px;margin:13px 0;font-size:12px;font-weight:800}
input{background:#0c1c2d;border:1px solid #527289;border-radius:11px;padding:9px 13px;min-height:47px;color:#eef8ff;font:inherit}
input:focus{border-color:#98e9dd;outline:2px solid #98e9dd26}
button{cursor:pointer}
.submit{width:100%;min-height:50px;margin-top:18px;border:0;border-radius:11px;
background:linear-gradient(105deg,#93e4d6,#abb8f4);color:#0b2034;font:900 14px Tahoma}
.submit:disabled{opacity:.55}
.note{font-size:11px;color:#91aebf;margin-top:15px}
#msg{font-size:12px;min-height:0;line-height:2;color:#b9e8da;margin:14px 0 0}
#msg.error{color:#efc1a8}
</style>
</head>
<body>
<div class="login" id="loginBox">
 <div class="mark">D</div>
 <span class="eyebrow">DEELA BOOKS · PRIVATE LAUNCH</span>
 <h1>بوابة ديلا للكتب</h1>
 <p>منصة رسمية لنشر وبيع الكتب والمؤلفين والمتاجر. الموقع ما زال خاصًا بالمالك؛ لا تظهر الكتب أو لوحة التحكم للزائر.</p>
 <form id="signin">
  <label>بريد حساب مالك DEELA<input id="email" type="email" autocomplete="username" placeholder="example@email.com" maxlength="254" required></label>
  <label>كلمة مرور المالك<input id="password" type="password" autocomplete="current-password" required></label>
  <button id="signinButton" class="submit" type="submit">افتح منصة DEELA Books ←</button>
 </form>
 <p id="msg" aria-live="polite" role="status"></p>
 <p class="note">🔒 صفحة الدخول فقط عامة. تُحمّل بقية ملفات المنصة من خادم خاص بعد التحقق من صلاحية المالك.</p>
</div>
<script>
(()=>{
"use strict";
const AUTH="https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1/deela-control/api/v1/auth/login";
const VAULT="https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1/deela-books-vault/protected/";
const $=id=>document.getElementById(id);
const msg=(s,bad=false)=>{const n=$("msg");if(n){n.textContent=s;n.classList.toggle("error",bad)}};
let busy=false;
async function asset(file,token){
 let r;
 try{r=await fetch(VAULT+file,{headers:{"Authorization":"Bearer "+token},cache:"no-store",credentials:"omit",signal:AbortSignal.timeout(25000)})}
 catch{throw Error("تعذر تحميل ملفات DEELA Books من الخادم")}
 const body=await r.json().catch(()=>({}));
 if(!r.ok)throw Error(body.error||"انتهت الجلسة أو تعذّر تحميل ملفات المتجر الخاص");
 if(typeof body.content!=="string")throw Error("ملف المنصة غير صالح");
 return body.content;
}
async function render(token){
 msg("نجح دخول المالك، جارٍ تحميل واجهة الكتب كاملة…");
 const [html0,css,js]=await Promise.all([
  asset("index.html",token),asset("style.css",token),asset("app.js",token)]);
 let html=html0;
 const cssLink='<link rel="stylesheet" href="./style.css">';
 const iconLink='<link rel="icon" href="./icon.svg" type="image/svg+xml">';
 const jsLink='<scr'+'ipt defer src="./app.js"></scr'+'ipt>';
 if(!html.includes(jsLink))throw Error("تعذر تجهيز سكربت DEELA Books");
 html=html.replace(cssLink,"").replace(iconLink,"").replace(jsLink,"");
 const cssTag="<style>"+css.replace(/<\/style/gi,"<\\/style")+"</style>";
 html=html.replace("</head>",cssTag+"</head>");
 const boot="<scr"+"ipt>window.__DEELA_BOOKS_TOKEN="+JSON.stringify(token)+";</scr"+"ipt>";
 const safeJS=js.replace(/<\/script/gi,"<\\/script");
 const run="<scr"+"ipt>"+safeJS+"</scr"+"ipt>";
 const accountMarkup='id="accountButton">حسابي <span>◌</span></button>';
 if(!html.includes(accountMarkup))throw Error("تعذر تجهيز شريط حساب المالك");
 const logout='<button type="button" class="account-pill" id="privateLogout" style="min-height:0;margin-inline-start:8px">تسجيل الخروج</button>';
 html=html.replace(accountMarkup,'id="accountButton">حساب المالك ◌</button>'+logout);
 const listener="<scr"+"ipt>document.getElementById('privateLogout').onclick=function(){sessionStorage.removeItem('deela-books-token');location.replace(location.pathname)};</scr"+"ipt>";
 html=html.replace("</body>",boot+run+listener+"</body>");
 document.open();document.write(html);document.close();
}
async function login(event){
 event.preventDefault();if(busy)return;busy=true;
 $("signinButton").disabled=true;msg("جارٍ تسجيل الدخول والتحقق من صلاحية المالك…");
 const password=$("password").value;
 try{
  let r;
  try{r=await fetch(AUTH,{method:"POST",
    headers:{"Content-Type":"application/json"},
    body:JSON.stringify({email:$("email").value.trim().toLowerCase(),password,platform:"android"}),
    credentials:"omit",cache:"no-store",signal:AbortSignal.timeout(25000)})}
  catch{throw Error("تعذر الاتصال بحساب DEELA")}
  const data=await r.json().catch(()=>({}));
  if(!r.ok||!data.access_token)throw Error(data.error||"بيانات تسجيل الدخول غير صحيحة");
  if(data.role!=="owner")throw Error("هذه الصفحة خاصة بمالك DEELA فقط");
  $("password").value="";
  await render(data.access_token);
 }catch(e){msg(e.message||"فشل الدخول",true);const btn=$("signinButton");if(btn)btn.disabled=false}
 finally{busy=false}
}
$("signin").addEventListener("submit",login);
})();
</script>
</body></html>
