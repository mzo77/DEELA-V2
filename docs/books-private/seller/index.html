<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="robots" content="noindex,nofollow,noarchive"><meta name="referrer" content="no-referrer"><meta name="theme-color" content="#101b2d"><title>بوابة البائع الخاصة | DEELA Books</title><style>*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(circle at 15% 10%,#263d58,#0c1524 55%);color:#eff7ff;font:16px/1.9 system-ui,Tahoma,sans-serif;display:grid;place-items:center;padding:20px}.box{width:min(100%,440px);padding:30px;border:1px solid #355069;border-radius:24px;background:#18283df2;box-shadow:0 24px 70px #030a16a3}h1{margin:0 0 4px;font-size:25px}.muted{color:#a3b8cb}.brand{color:#e6c59e;letter-spacing:.1em;font-weight:800}label{display:block;margin:18px 0 5px}input{width:100%;padding:13px;border:1px solid #4c6d80;border-radius:12px;background:#0c1524;color:#eff7ff;font:inherit}button{width:100%;margin-top:22px;padding:13px;border:0;border-radius:12px;background:#e6c59e;color:#101b2d;font:700 16px inherit;cursor:pointer}#msg{min-height:24px;color:#ffb6b6}small{display:block;margin-top:18px;color:#a3b8cb}</style></head><body><main class="box"><div class="brand">DEELA BOOKS</div><h1>بوابة البائع الخاصة</h1><p class="muted">إدارة كتبك ومتابعة الإعجابات والمشاهدات والتنبيهات. هذه البوابة لا تفتح المتجر للعامة.</p><form id="login"><label for="email">البريد الإلكتروني</label><input id="email" type="email" autocomplete="username" required><label for="password">كلمة المرور</label><input id="password" type="password" autocomplete="current-password" required><button id="submit">دخول البائع</button><p id="msg" role="status"></p></form><small>الدخول للبائعين المعتمدين فقط. <a style="color:#e6c59e" href="https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1/deela-control/recover" rel="noopener noreferrer">استعادة كلمة المرور</a>.</small></main><script>const AUTH="https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1/deela-control/api/v1/auth/login",VAULT="https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1/deela-books-vault";document.getElementById("login").addEventListener("submit",async e=>{e.preventDefault();const b=document.getElementById("submit"),m=document.getElementById("msg");b.disabled=true;m.textContent="جارٍ التحقق…";try{const r=await fetch(AUTH,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({email:document.getElementById("email").value.trim(),password:document.getElementById("password").value,platform:"web"}),credentials:"omit"}),d=await r.json().catch(()=>({}));if(!r.ok||!d.access_token)throw Error(d.error||"تعذر تسجيل الدخول");const h={Authorization:"Bearer "+d.access_token};const names=["index.html","style.css","app.js"],assets=await Promise.all(names.map(async n=>{const x=await fetch(VAULT+"/protected/"+n,{headers:h,cache:"no-store"});const j=await x.json().catch(()=>({}));if(!x.ok)throw Error(j.error||"الحساب غير معتمد للدخول إلى بوابة البائعين");return j.content}));let html=assets[0];html=html.replace('<link rel="stylesheet" href="./style.css">','<style>'+assets[1]+'</style>').replace('<script defer src="./app.js"></script>','<script>window.__DEELA_BOOKS_TOKEN='+JSON.stringify(d.access_token)+';<\/script><script>'+assets[2]+'<\/script>');document.open();document.write(html);document.close()}catch(x){m.textContent=x instanceof Error?x.message:"تعذر تسجيل الدخول"}finally{b.disabled=false}});</script></body></html>
