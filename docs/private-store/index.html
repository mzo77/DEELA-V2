<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow,noarchive,nosnippet">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0b1628">
<title>DEELA — بوابة المالك الخاصة</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%238bded9'/%3E%3Ctext x='13' y='49' font-size='46' font-weight='bold' font-family='Arial' fill='%2312253c'%3ED%3C/text%3E%3C/svg%3E">
<style>
*{box-sizing:border-box}
html{background:#081322;color:#eaf6ff;color-scheme:dark}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:17px;font:500 14px/1.9 Tahoma,Arial,sans-serif;background:radial-gradient(circle at 85% 10%,#294c63 0,#0d1b32 49%,#070f1d 100%)}
.portal{width:min(450px,100%);border:1px solid #577b92;background:linear-gradient(135deg,#1a334a,#13243a);padding:32px;border-radius:24px;box-shadow:0 20px 75px #020811c4}
.mark{display:grid;place-items:center;width:67px;height:67px;border-radius:19px;font:900 45px Arial,sans-serif;color:#0e2439;background:linear-gradient(135deg,#94e7da,#90b4ed,#a998ef)}
.eyebrow{display:block;font:800 10px Arial,sans-serif;letter-spacing:2px;margin-top:15px;color:#90e8dc}
h1{margin:11px 0 8px;font-size:27px}
p{font-size:12px;color:#bed1e2;line-height:2;margin:0 0 19px}
label{display:grid;gap:6px;margin:13px 0;font-size:12px;font-weight:800}
input{height:46px;width:100%;background:#0b1c30;border:1px solid #4b6e84;border-radius:11px;color:white;padding:10px 13px;font:inherit;outline:0}
input:focus{border-color:#93e9de;box-shadow:0 0 0 3px #70cac722}
button{display:block;width:100%;min-height:49px;margin-top:18px;background:linear-gradient(110deg,#94e7db,#a5b5ef);border:0;border-radius:12px;color:#0b1c2c;font:900 14px Tahoma,Arial,sans-serif;cursor:pointer}
button:disabled{opacity:.6}
.note{font-size:11px;color:#92b2c4;margin-top:20px}
#message{min-height:0;margin:14px 0 0;color:#a7eadf}
#message.bad{color:#f1c6a3}
[hidden]{display:none!important}
</style>
</head>
<body>
<main class="portal" id="portal">
 <div class="mark" aria-hidden="true">D</div>
 <span class="eyebrow">DEELA · PRIVATE OWNER ACCESS</span>
 <h1>متجر ديلا الرسمي</h1>
 <p>المتجر ولوحة التحكم متصلان بمشروع DEELA الحقيقي، ومحتوى الموقع غير متاح للزوار حاليًا.</p>
 <form id="loginForm">
  <label>البريد الإلكتروني للمالك
   <input id="email" type="email" autocomplete="username" required maxlength="254" placeholder="example@gmail.com">
  </label>
  <label>كلمة مرور حساب ديلا
   <input id="password" type="password" autocomplete="current-password" required>
  </label>
  <button id="submit" type="submit">دخول مركز DEELA الخاص ←</button>
 </form>
 <p id="message" role="status" aria-live="polite"></p>
 <p class="note">🔒 الصفحة العامة هي تسجيل الدخول فقط؛ الصور والمنتجات ولوحة المالك لا تُحمّل إلا بعد التحقق من صلاحية المالك في الخادم.</p>
</main>
<script>
(()=>{
"use strict";
const ROOT="https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1/";
const PRIVATE=ROOT+"deela-private-store";
const AUTH=ROOT+"deela-control/api/v1/auth/login";
const SESSION="deela-private-website-owner-v1";
const $=id=>document.getElementById(id);
const msg=(message,bad=false)=>{const el=$("message");el.textContent=message;el.classList.toggle("bad",bad)};
let busy=false;
async function privateFile(name,token){
 const response=await fetch(PRIVATE+"/protected/"+name,{
  headers:{"Authorization":"Bearer "+token},
  credentials:"omit",cache:"no-store",signal:AbortSignal.timeout(25000)
 });
 if(response.status===401||response.status===403)throw Error("انتهت جلسة المالك أو ليست لديك الصلاحية المطلوبة");
 if(!response.ok)throw Error("تعذّر تحميل ملفات المتجر الخاص");
 const data=await response.json();
 if(typeof data.content!=="string")throw Error("بيانات الموقع غير صالحة");
 return data.content;
}
async function render(token){
 msg("تم التحقق. جارٍ تجهيز واجهة DEELA الخاصة…");
 const view=new URL(location.href).searchParams.get("page")||"shop";
 const page=["admin","help"].includes(view)?view:"shop";
 const root=page==="admin"?"admin/index.html":page==="help"?"help.html":"index.html";
 const script=page==="admin"?"admin/admin.js":page==="shop"?"app.js":null;
 const stylesheet=await privateFile("style.css",token);
 const extraStyle=page==="admin"?await privateFile("admin/admin.css",token):"";
 let html=await privateFile(root,token);
 let javascript=script?await privateFile(script,token):"";
 // Everything here is fetched from the server AFTER owner verification.
 // The original storefront HTML/CSS/JS is never hosted on public Pages.
 sessionStorage.setItem("deela-shop-token",token);
 sessionStorage.setItem("deela-shop-owner-session",token);
 if(javascript){
  if(page==="shop"){
   javascript=javascript.replace(
    'if(auth&&token)headers.Authorization="Bearer "+token;',
    'if(token)headers.Authorization="Bearer "+token;'
   );
  }
 }
 const css="<style id=\"deela-private-style\">"+stylesheet.replace(/<\/style/gi,"<\\/style")+
 (extraStyle?"\n"+extraStyle.replace(/<\/style/gi,"<\\/style"):"")+"</style>";
 html=html.replace(/<link\s+rel="stylesheet"\s+href="(?:\.\.\/)?style\.css">/g,"")
  .replace(/<link\s+rel="stylesheet"\s+href="\.\/admin\.css">/g,"")
  .replace("</head>",css+"</head>");
 if(script){
  const pattern=page==="admin"?'<script defer src="./admin.js"><\/script>':'<script defer src="./app.js"><\/script>';
  if(!html.includes(pattern))throw Error("تعذّر تحميل برنامج المتجر");
  const safe=javascript.replace(/<\/script/gi,"<\\/script");
  html=html.replace(pattern,'<script type="module">'+safe+"<\/script>");
 }
 if(page==="help"){
  html=html.replace(
   'fetch("https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1/deela-shop/catalog",{cache:"no-store"})',
   'fetch("https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1/deela-shop/catalog",{cache:"no-store",headers:{"Authorization":"Bearer "+sessionStorage.getItem("deela-shop-token")}})'
  );
 }
 // Keep store navigation on the private portal, without public HTML files.
 html=html.replace(/href="\.\/admin\/index\.html"/g,'href="?page=admin"')
  .replace(/href="\.\/help\.html#support"/g,'href="?page=help#support"')
  .replace(/href="\.\/help\.html"/g,'href="?page=help"')
  .replace(/href="(?:\.\.\/)?index\.html\?product=/g,'href="?product=')
  .replace(/href="(?:\.\.\/)?index\.html"/g,'href="?page=shop"')
  .replace(/href="\.\/"/g,'href="?page=shop"')
  .replace(/href="\.\.\/"/g,'href="?page=shop"')
  .replace(/href="\.\/#products"/g,'href="?page=shop#products"');
 const exit='<button type="button" id="deelaPrivateSignOut" style="position:fixed;z-index:9999;left:8px;top:39px;background:#19394e;color:#efffff;border:1px solid #9de2df;border-radius:9px;padding:6px 12px;font:700 11px Tahoma,Arial;width:auto;min-height:0;margin:0">خروج المالك</button>'+
 '<script type="module">document.getElementById("deelaPrivateSignOut").onclick=()=>{'+
 'sessionStorage.removeItem("'+SESSION+'");sessionStorage.removeItem("deela-shop-token");'+
 'sessionStorage.removeItem("deela-shop-owner-session");location.replace(location.pathname)};<\/script>';
 html=html.replace("</body>",exit+"</body>");
 document.open();
 document.write(html);
 document.close();
}
async function signIn(ev){
 ev.preventDefault();if(busy)return;busy=true;$("submit").disabled=true;
 msg("جارٍ التحقق من صلاحيات المالك…");
 const email=$("email").value.trim().toLowerCase();
 const password=$("password").value;
 try{
  const response=await fetch(AUTH,{
   method:"POST",headers:{"Content-Type":"application/json"},
   body:JSON.stringify({email,password,platform:"android"}),
   credentials:"omit",cache:"no-store",signal:AbortSignal.timeout(25000)
  });
  const result=await response.json().catch(()=>({}));
  if(!response.ok)throw Error(result.error||"بيانات الدخول غير صحيحة");
  if(result.role!=="owner"||!result.access_token)throw Error("الصفحة خاصة بمالك DEELA فقط");
  $("password").value="";
  sessionStorage.setItem(SESSION,result.access_token);
  await render(result.access_token);
 }catch(err){
  msg(err?.message||"تعذر تسجيل الدخول",true);
  if(/صلاحية|جلسة/.test(err?.message||""))sessionStorage.removeItem(SESSION);
  if($("submit"))$("submit").disabled=false;busy=false;
 }
}
$("loginForm").addEventListener("submit",signIn);
const existing=sessionStorage.getItem(SESSION);
if(existing){
 render(existing).catch(e=>{
  sessionStorage.removeItem(SESSION);
  msg(e?.message||"تعذّر استعادة جلسة المالك",true);
 });
}
})();
</script>
</body>
</html>
