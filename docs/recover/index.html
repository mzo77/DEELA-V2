<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><title>ديلا | تغيير كلمة المرور</title><style>body{background:#0c090e;color:#fff;font:16px system-ui;margin:0;min-height:100vh;display:grid;place-items:center}.card{width:min(90vw,440px);padding:25px;border:1px solid #713348;border-radius:22px;background:#1c111a}h1{color:#ff2856}input,button{box-sizing:border-box;width:100%;padding:15px;margin:10px 0;border-radius:12px;font:inherit}input{background:#120c11;border:1px solid #794354;color:white}button{border:0;background:#ff2856;color:white;font-weight:bold}#msg{line-height:1.8}</style></head><body><main class="card"><h1>تطبيقات ديلا ❤️</h1><h2>تعيين كلمة مرور جديدة</h2><form id="form"><input id="password" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="كلمة المرور الجديدة (12 حرفًا على الأقل)" required><input id="confirm" type="password" autocomplete="new-password" minlength="12" maxlength="128" placeholder="تأكيد كلمة المرور" required><button id="submit">حفظ كلمة المرور</button></form><p id="msg" role="status"></p></main><script>
(()=>{'use strict';const api='https://rxlynynjetajtsqlhkrq.supabase.co/functions/v1/deela-control/api/v1/auth/reset',q=new URLSearchParams(location.search),h=new URLSearchParams(location.hash.slice(1)),token=q.get('token_hash')||'',access=h.get('access_token')||'',type=q.get('type')||h.get('type')||'recovery',form=document.getElementById('form'),msg=document.getElementById('msg');history.replaceState(null,'',location.pathname);if((!token&&!access)||type!=='recovery'){form.hidden=true;msg.textContent='رابط الاستعادة غير صالح أو انتهت صلاحيته. اطلب رسالة جديدة من تطبيق ديلا.';return}form.onsubmit=async e=>{e.preventDefault();const p=document.getElementById('password').value,c=document.getElementById('confirm').value,btn=document.getElementById('submit');if(p!==c){msg.textContent='كلمتا المرور غير متطابقتين';return}btn.disabled=true;msg.textContent='جارٍ تحديث كلمة المرور...';try{const r=await fetch(api,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({token_hash:token,recovery_access_token:access,password:p})});const d=await r.json();if(!r.ok)throw Error(d.error||'تعذر تغيير كلمة المرور');form.hidden=true;msg.textContent='تم تغيير كلمة المرور بنجاح. افتح تطبيق ديلا وسجّل دخولك بكلمة المرور الجديدة.'}catch(err){msg.textContent=err.message||'حدث خطأ. اطلب رابط استعادة جديدًا.'}finally{btn.disabled=false}}})();
</script></body></html>
